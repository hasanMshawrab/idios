openapi: 3.1.0
info:
    title: IdiosService API
    version: 1.0.0
paths:
    /v1/clusters:
        get:
            tags:
                - IdiosService
            summary: ListClusters
            operationId: ListClusters
            parameters:
                - name: cluster_ids
                  in: query
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                        format: int64
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ClustersResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        post:
            tags:
                - IdiosService
            summary: AddCluster
            operationId: AddCluster
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddClusterRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Cluster'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/kube/contexts:
        get:
            tags:
                - IdiosService
            summary: ListKubeContexts
            operationId: ListKubeContexts
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/KubeContextsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/kube/contexts/{context}/namespaces:
        get:
            tags:
                - IdiosService
            summary: ListKubeNamespaces
            description: The only read that talks to a cluster, used by the add-cluster flow.
            operationId: ListKubeNamespaces
            parameters:
                - name: context
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/KubeNamespacesResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/incidents:
        get:
            tags:
                - IdiosService
            summary: ListIncidents
            operationId: ListIncidents
            parameters:
                - name: cluster_ids
                  in: query
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                        format: int64
                - name: state
                  in: query
                  description: |-
                    One of open, acknowledged, recovered, pod_deleted, job_finished, manual,
                     dismissed, attention.
                  required: false
                  schema:
                    type: string
                - name: category
                  in: query
                  description: |-
                    One of the Category values as stored: oom, crash, unclean_exit,
                     image_pull, config, probe, scheduling, node_pressure, rescheduled,
                     job_failed, stuck, other.
                  required: false
                  schema:
                    type: string
                - name: namespace
                  in: query
                  required: false
                  schema:
                    type: string
                - name: workload_kind
                  in: query
                  required: false
                  schema:
                    type: string
                - name: workload_name
                  in: query
                  required: false
                  schema:
                    type: string
                - name: pod_uid
                  in: query
                  required: false
                  schema:
                    type: string
                - name: job_uid
                  in: query
                  required: false
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Zero means the daemon's configured default.
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: node_name
                  in: query
                  description: |-
                    Only the incidents opened on this node; a pod that had no node when its
                     incident opened matches nothing.
                  required: false
                  schema:
                    type: string
                - name: pod_name
                  in: query
                  description: |-
                    pod_name is an exact match on the pod's name, so a client holding a
                     name from a truncated list still reaches its rows.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IncidentsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/incidents/counts:
        get:
            tags:
                - IdiosService
            summary: GetIncidentCounts
            operationId: GetIncidentCounts
            parameters:
                - name: cluster_ids
                  in: query
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                        format: int64
                - name: state
                  in: query
                  description: |-
                    One of open, acknowledged, recovered, pod_deleted, job_finished, manual,
                     dismissed, attention.
                  required: false
                  schema:
                    type: string
                - name: category
                  in: query
                  description: |-
                    One of the Category values as stored: oom, crash, unclean_exit,
                     image_pull, config, probe, scheduling, node_pressure, rescheduled,
                     job_failed, stuck, other.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IncidentCounts'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/incidents/{id}:
        get:
            tags:
                - IdiosService
            summary: GetIncident
            operationId: GetIncident
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IncidentDetail'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
        delete:
            tags:
                - IdiosService
            summary: DeleteIncident
            operationId: DeleteIncident
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteIncidentResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/incidents/{id}/timeline:
        get:
            tags:
                - IdiosService
            summary: IncidentTimeline
            operationId: IncidentTimeline
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TimelineResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/incidents/stream:
        get:
            tags:
                - IdiosService
            summary: StreamIncidents
            operationId: StreamIncidents
            parameters:
                - name: cluster_ids
                  in: query
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                        format: int64
            responses:
                "200":
                    description: Server-Sent Events stream
                    content:
                        text/event-stream:
                            schema:
                                type: string
                                description: SSE stream. Each event contains a JSON-encoded IncidentRow in the data field.
                    x-sse-event-schema:
                        $ref: '#/components/schemas/IncidentRow'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/clusters/stream:
        get:
            tags:
                - IdiosService
            summary: StreamClusters
            operationId: StreamClusters
            parameters:
                - name: cluster_ids
                  in: query
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                        format: int64
            responses:
                "200":
                    description: Server-Sent Events stream
                    content:
                        text/event-stream:
                            schema:
                                type: string
                                description: SSE stream. Each event contains a JSON-encoded Cluster in the data field.
                    x-sse-event-schema:
                        $ref: '#/components/schemas/Cluster'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/pods:
        get:
            tags:
                - IdiosService
            summary: ListPods
            operationId: ListPods
            parameters:
                - name: cluster_ids
                  in: query
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                        format: int64
                - name: namespace
                  in: query
                  required: false
                  schema:
                    type: string
                - name: workload_kind
                  in: query
                  required: false
                  schema:
                    type: string
                - name: workload_name
                  in: query
                  required: false
                  schema:
                    type: string
                - name: live
                  in: query
                  description: '"true" for live pods, "false" for deleted ones, absent for both.'
                  required: false
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Zero means the daemon's configured default.
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: pod_name
                  in: query
                  description: |-
                    pod_name is an exact match on name, so a client holding a name from a
                     truncated list still reaches its row.
                  required: false
                  schema:
                    type: string
                - name: job_uid
                  in: query
                  description: |-
                    job_uid is the controller uid of the Job that owns the pod, so a run can
                     list every attempt it made and not only the ones that failed.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PodsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/pods/{uid}:
        get:
            tags:
                - IdiosService
            summary: GetPod
            operationId: GetPod
            parameters:
                - name: uid
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PodDetail'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/pods/{uid}/events:
        get:
            tags:
                - IdiosService
            summary: PodEvents
            operationId: PodEvents
            parameters:
                - name: uid
                  in: path
                  required: true
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Zero means the daemon's configured default.
                  required: false
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EventsResponse'
                "400":
