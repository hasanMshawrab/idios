                    example: '0/1 nodes are available: 1 Insufficient cpu.'
                deletionRequestedAt:
                    type: string
                    examples:
                        - "2026-08-27T14:07:52.104881Z"
                    example: "2026-08-27T14:07:52.104881Z"
                qosClass:
                    type: string
                    examples:
                        - Burstable
                        - Guaranteed
