components:
    schemas:
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        ListClustersRequest:
            type: object
            properties:
                clusterIds:
                    type: array
                    items:
                        type: string
                        format: int64
            description: ListClustersRequest scopes the cluster list.
        ClustersResponse:
            type: object
            properties:
                clusters:
                    type: array
                    items:
                        $ref: '#/components/schemas/Cluster'
                truncated:
                    type: boolean
                    examples:
                        - false
                        - true
                    example: false
            description: ClustersResponse is the cluster list.
        Cluster:
            type: object
            properties:
                id:
                    type: string
                    examples:
                        - "1"
                        - "2"
                    format: int64
                    example: "1"
                identity:
                    type: string
                    examples:
                        - 6f1c8e2a-4b3d-4c5e-9f80-1a2b3c4d5e6f
                    example: 6f1c8e2a-4b3d-4c5e-9f80-1a2b3c4d5e6f
                name:
                    type: string
                    examples:
                        - prod
                        - staging
                    example: prod
                contextName:
                    type: string
                    examples:
                        - orbstack
                        - prod-eu
                    example: orbstack
                apiServerUrl:
                    type: string
                    examples:
                        - https://127.0.0.1:26443
                    example: https://127.0.0.1:26443
                firstSeenAt:
                    type: string
                    examples:
                        - "2026-08-27T13:58:02.110394Z"
                    example: "2026-08-27T13:58:02.110394Z"
                lastConnectedAt:
                    type: string
                    examples:
                        - "2026-08-27T14:09:41.115204Z"
                    example: "2026-08-27T14:09:41.115204Z"
                lastError:
                    type: string
                    examples:
                        - 'dial tcp 127.0.0.1:26443: connect: connection refused'
                    example: 'dial tcp 127.0.0.1:26443: connect: connection refused'
                lastErrorAt:
                    type: string
                    examples:
                        - "2026-08-27T14:10:12.004881Z"
                    example: "2026-08-27T14:10:12.004881Z"
                namespaces:
                    type: array
                    items:
                        type: string
                        examples:
                            - shop
                            - payments
                        example: shop
                ready:
                    type: boolean
                    examples:
                        - true
                        - false
                    example: true
                lastEventAt:
                    type: string
                    examples:
                        - "2026-08-27T14:09:41.115204Z"
                    example: "2026-08-27T14:09:41.115204Z"
                skewSeconds:
                    type: number
                    examples:
                        - 0.184
                        - -1.2
                    format: double
                    example: 0.184
                grafanaUrl:
                    type: string
                    examples:
                        - https://logs.example.grafana.net
                    example: https://logs.example.grafana.net
                lokiDatasourceUid:
                    type: string
                    examples:
                        - grafanacloud-logs
                    example: grafanacloud-logs
                logSelector:
                    type: string
                    examples:
                        - '{namespace="$namespace", pod="$pod", container="$container"}'
                    example: '{namespace="$namespace", pod="$pod", container="$container"}'
            description: |-
                Cluster is a clusters row with its watched namespaces and the state only
                 the running process knows.
        ListKubeContextsRequest:
            type: object
            description: |-
                ListKubeContextsRequest takes no parameters; the kubeconfig is the
                 daemon's.
        KubeContextsResponse:
            type: object
            properties:
                contexts:
                    type: array
                    items:
                        $ref: '#/components/schemas/KubeContext'
                truncated:
                    type: boolean
                    examples:
                        - false
                        - true
                    example: false
            description: KubeContextsResponse is the kubeconfig's contexts.
        KubeContext:
            type: object
            properties:
                name:
                    type: string
                    examples:
                        - orbstack
                        - prod-eu
                    example: orbstack
                cluster:
                    type: string
                    examples:
                        - orbstack
                    example: orbstack
                server:
                    type: string
                    examples:
                        - https://127.0.0.1:26443
                    example: https://127.0.0.1:26443
            description: |-
                KubeContext is one context of the kubeconfig the daemon reads. It carries
                 no credentials.
        ListKubeNamespacesRequest:
            type: object
            properties:
                context:
                    type: string
            description: ListKubeNamespacesRequest names the context to ask.
        KubeNamespacesResponse:
            type: object
            properties:
                names:
                    type: array
                    items:
                        type: string
                        examples:
                            - shop
                            - payments
                            - default
                        example: shop
                forbidden:
                    type: boolean
                    examples:
                        - false
                        - true
                    description: |-
                        True when the Role cannot list namespaces, so names is empty without
                         that meaning the cluster has none.
                    example: false
            description: KubeNamespacesResponse is what one cluster answered.
        ListIncidentsRequest:
            type: object
            properties:
                clusterIds:
                    type: array
                    items:
                        type: string
                        format: int64
                state:
                    type: string
                    description: |-
                        One of open, acknowledged, recovered, pod_deleted, job_finished, manual,
                         dismissed, attention.
                category:
                    type: string
                    description: |-
                        One of the Category values as stored: oom, crash, unclean_exit,
                         image_pull, config, probe, scheduling, node_pressure, rescheduled,
                         job_failed, stuck, other.
                namespace:
                    type: string
                workloadKind:
                    type: string
                workloadName:
                    type: string
                podUid:
                    type: string
                jobUid:
                    type: string
                limit:
                    type: integer
                    format: int32
                    description: Zero means the daemon's configured default.
                nodeName:
                    type: string
                    description: |-
                        Only the incidents opened on this node; a pod that had no node when its
                         incident opened matches nothing.
                podName:
                    type: string
                    description: |-
                        pod_name is an exact match on the pod's name, so a client holding a
                         name from a truncated list still reaches its rows.
            description: |-
                ListIncidentsRequest scopes and filters the triage list. An empty filter
                 means the filter is not applied.
        IncidentsResponse:
            type: object
            properties:
                incidents:
                    type: array
                    items:
                        $ref: '#/components/schemas/IncidentRow'
                truncated:
                    type: boolean
                    examples:
                        - false
                        - true
                    example: false
            description: IncidentsResponse is the triage list.
        IncidentRow:
            type: object
            properties:
                id:
                    type: string
                    examples:
                        - "412"
                        - "413"
                    format: int64
                    example: "412"
                clusterId:
                    type: string
                    examples:
                        - "1"
                        - "2"
                    format: int64
                    example: "1"
                namespace:
                    type: string
                    examples:
                        - shop
                        - payments
                    example: shop
                subjectKind:
                    type: string
                    enum:
                        - SUBJECT_KIND_UNSPECIFIED
                        - pod
                        - job
                    description: SubjectKind distinguishes which kind of workload an incident is about.
                podUid:
                    type: string
                    examples:
                        - 8f14e45f-ceea-467a-9a1e-2b3c4d5e6f70
                    example: 8f14e45f-ceea-467a-9a1e-2b3c4d5e6f70
                jobUid:
                    type: string
                    examples:
                        - 6d3a1f80-9c2b-4e77-b1a5-0e9f8d7c6b5a
                    example: 6d3a1f80-9c2b-4e77-b1a5-0e9f8d7c6b5a
                containerName:
                    type: string
                    examples:
                        - checkout-api
                        - ""
                    example: checkout-api
                workloadKind:
                    type: string
                    examples:
                        - Deployment
                        - Job
                    example: Deployment
                workloadName:
                    type: string
                    examples:
                        - checkout-api
                    example: checkout-api
                category:
                    type: string
                    enum:
                        - CATEGORY_UNSPECIFIED
                        - oom
                        - crash
                        - image_pull
                        - config
                        - probe
                        - scheduling
                        - node_pressure
                        - rescheduled
                        - job_failed
                        - other
                        - stuck
                        - unclean_exit
                    description: Category classifies what kind of incident was observed.
                firstReason:
                    type: string
                    examples:
                        - Error
                        - CrashLoopBackOff
                    example: Error
                lastReason:
                    type: string
                    examples:
                        - CrashLoopBackOff
                        - OOMKilled
                    example: CrashLoopBackOff
                lastMessage:
                    type: string
                    examples:
                        - back-off 5m0s restarting failed container=checkout-api
                    example: back-off 5m0s restarting failed container=checkout-api
                image:
                    type: string
                    examples:
                        - registry.example.com/checkout-api:1.42.0
                    example: registry.example.com/checkout-api:1.42.0
                imageTag:
                    type: string
                    examples:
                        - 1.42.0
                    example: 1.42.0
                imageId:
                    type: string
                    examples:
                        - registry.example.com/checkout-api@sha256:9f2e5c0a1b7d4e6f8a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f
                    example: registry.example.com/checkout-api@sha256:9f2e5c0a1b7d4e6f8a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f
                occurrences:
                    type: integer
                    examples:
                        - 7
                        - 1
                        - 23
                    format: int32
                    example: 7
                openedAt:
                    type: string
                    examples:
                        - "2026-08-27T14:03:11.482913Z"
                    example: "2026-08-27T14:03:11.482913Z"
                lastSeenAt:
                    type: string
                    examples:
                        - "2026-08-27T14:09:41.115204Z"
                    example: "2026-08-27T14:09:41.115204Z"
                closedAt:
                    type: string
                    examples:
                        - "2026-08-27T14:19:03.220118Z"
                    example: "2026-08-27T14:19:03.220118Z"
                closeReason:
                    type: string
                    enum:
                        - CLOSE_REASON_UNSPECIFIED
                        - recovered
                        - pod_deleted
                        - job_finished
                        - manual
                    description: CloseReason records why an incident was closed.
                acknowledgedAt:
                    type: string
                    examples:
                        - "2026-08-27T14:05:00.000000Z"
                    example: "2026-08-27T14:05:00.000000Z"
                dismissedAt:
                    type: string
                    examples:
                        - "2026-08-27T14:22:31.771903Z"
                    example: "2026-08-27T14:22:31.771903Z"
                note:
                    type: string
                    examples:
                        - waiting on the 1.42.1 image
                    example: waiting on the 1.42.1 image
                state:
                    type: string
                    enum:
                        - INCIDENT_STATE_UNSPECIFIED
                        - open
                        - acknowledged
                        - recovered
                        - pod_deleted
                        - job_finished
                        - manual
                        - dismissed
                        - attention
                    description: |-
                        IncidentState is the state derived from the timestamps of an incident row;
                         it is not a stored column.
                podName:
                    type: string
                    examples:
                        - checkout-api-7d9f8b6c4-x2kqp
                    example: checkout-api-7d9f8b6c4-x2kqp
                podDeletedAt:
                    type: string
                    examples:
                        - "2026-08-27T14:11:02.660713Z"
                    example: "2026-08-27T14:11:02.660713Z"
                podDeletionReason:
                    type: string
                    enum:
                        - DELETION_REASON_UNSPECIFIED
                        - rollout
                        - replaced
                        - scaled_down
                        - job_pruned
                        - unknown
                        - evicted
                    description: DeletionReason is the inferred reason a pod was removed.
                containerCount:
                    type: integer
                    examples:
                        - 2
                        - 1
                    format: int32
                    example: 2
                exitCode:
                    type: integer
                    examples:
                        - 137
                        - 1
                    format: int32
                    example: 137
                signal:
                    type: integer
                    examples:
                        - 9
                    format: int32
                    example: 9
                nodeName:
                    type: string
                    examples:
                        - node-a
                        - node-b
                    description: |-
                        The node the pod was on when the incident opened, denormalised at open;
                         absent for a job incident and for a pod that had no node yet.
                    example: node-a
            description: |-
                IncidentRow is one row of the triage list: the incidents columns, the
                 derived state, and the pod facts the list shows beside them.
        GetIncidentCountsRequest:
            type: object
            properties:
                clusterIds:
                    type: array
                    items:
                        type: string
                        format: int64
                state:
                    type: string
                    description: |-
                        One of open, acknowledged, recovered, pod_deleted, job_finished, manual,
                         dismissed, attention.
                category:
                    type: string
                    description: |-
                        One of the Category values as stored: oom, crash, unclean_exit,
                         image_pull, config, probe, scheduling, node_pressure, rescheduled,
                         job_failed, stuck, other.
            description: |-
                GetIncidentCountsRequest scopes the sidebar numbers. An empty filter means
                 the filter is not applied.
        IncidentCounts:
            type: object
            properties:
                byState:
                    type: array
                    items:
                        $ref: '#/components/schemas/StateCount'
                byCategory:
                    type: array
                    items:
                        $ref: '#/components/schemas/CategoryCount'
            description: |-
                IncidentCounts holds the sidebar numbers. Each list is faceted: it is
                 filtered by the other axis's request field, never by its own, so a count
                 answers what the list would hold once its own facet is picked.
        StateCount:
            type: object
            properties:
                state:
                    type: string
                    enum:
                        - INCIDENT_STATE_UNSPECIFIED
                        - open
                        - acknowledged
                        - recovered
                        - pod_deleted
                        - job_finished
                        - manual
                        - dismissed
                        - attention
                    description: |-
                        IncidentState is the state derived from the timestamps of an incident row;
                         it is not a stored column.
                count:
                    type: integer
                    examples:
                        - 4
                        - 1
                        - 17
                    format: int32
                    example: 4
            description: StateCount is one incident state and how many incidents hold it.
        CategoryCount:
            type: object
            properties:
                category:
                    type: string
                    enum:
                        - CATEGORY_UNSPECIFIED
                        - oom
                        - crash
                        - image_pull
                        - config
                        - probe
                        - scheduling
                        - node_pressure
                        - rescheduled
                        - job_failed
                        - other
                        - stuck
                        - unclean_exit
                    description: Category classifies what kind of incident was observed.
                count:
                    type: integer
                    examples:
                        - 3
                        - 1
                        - 9
                    format: int32
                    example: 3
            description: CategoryCount is one category and how many incidents hold it.
        GetIncidentRequest:
            type: object
            properties:
                id:
                    type: string
                    format: int64
            description: GetIncidentRequest addresses one incidents row.
        IncidentDetail:
            type: object
            properties:
                incident:
                    $ref: '#/components/schemas/IncidentRow'
                pod:
                    $ref: '#/components/schemas/Pod'
                containers:
                    type: array
                    items:
                        $ref: '#/components/schemas/Container'
                artifacts:
                    type: array
                    items:
                        $ref: '#/components/schemas/Artifact'
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/K8sEvent'
                conditions:
