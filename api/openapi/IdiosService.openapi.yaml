                name:
                    type: string
                    examples:
                        - checkout-api-7d9f8b6c4-x2kqp
                    example: checkout-api-7d9f8b6c4-x2kqp
                nodeName:
                    type: string
                    examples:
                        - orbstack
                    example: orbstack
