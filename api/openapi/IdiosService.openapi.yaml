                controllerKind:
                    type: string
                    examples:
                        - ReplicaSet
                        - Job
                    example: ReplicaSet
                controllerName:
                    type: string
                    examples:
                        - checkout-api-7d9f8b6c4
                    example: checkout-api-7d9f8b6c4
                controllerUid:
                    type: string
                    examples:
                        - 3c1d0b2a-77aa-4f31-9b02-5d6e7f801122
