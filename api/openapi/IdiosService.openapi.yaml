    /v1/workloads:
        get:
            tags:
                - IdiosService
            summary: ListWorkloads
            operationId: ListWorkloads
            parameters:
                - name: cluster_ids
                  in: query
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                        format: int64
                - name: namespace
                  in: query
                  required: false
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Zero means the daemon's configured default.
                  required: false
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WorkloadsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/workloads/{cluster_id}/{namespace}/{kind}/{name}:
        get:
            tags:
                - IdiosService
            summary: GetWorkload
            description: |-
                name is required: a pod without a controller belongs to workload kind
                 none with an empty name, and that workload has no detail. A client
                 shows it from the list row and from ListPods filtered by
                 workload_kind=none.
            operationId: GetWorkload
            parameters:
                - name: cluster_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
                - name: namespace
                  in: path
                  required: true
                  schema:
                    type: string
                - name: kind
                  in: path
                  required: true
                  schema:
                    type: string
                - name: name
                  in: path
                  required: true
                  schema:
                    type: string
                - name: pods_live
                  in: query
                  description: '"true" for live pods, "false" for deleted ones, absent for both.'
                  required: false
                  schema:
                    type: string
                - name: pods_limit
                  in: query
                  description: Zero means the daemon's configured default.
                  required: false
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WorkloadDetail'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/jobs:
        get:
            tags:
                - IdiosService
            summary: ListJobs
            operationId: ListJobs
            parameters:
                - name: cluster_ids
                  in: query
                  required: false
                  style: form
                  explode: true
                  schema:
                    type: array
                    items:
                        type: string
                        format: int64
                - name: namespace
                  in: query
                  required: false
                  schema:
                    type: string
                - name: cronjob_uid
                  in: query
                  required: false
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Zero means the daemon's configured default.
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: cronjob_name
                  in: query
                  required: false
                  schema:
                    type: string
                - name: live
                  in: query
                  description: |-
                    "true" for runs still in the cluster, "false" for deleted ones, absent
                     for both.
                  required: false
                  schema:
                    type: string
                - name: failed
                  in: query
                  description: '"true" for runs whose condition is Failed, absent for every run.'
                  required: false
                  schema:
                    type: string
                - name: job_uid
                  in: query
                  description: |-
                    job_uid names one run exactly; a run page is keyed by it and no
                     other filter can reach a Job whose incidents were all swept.
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/JobsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ValidationError'
                default:
                    description: Error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/status:
