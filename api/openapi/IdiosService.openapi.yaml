                    description: |-
                        The Explore URL scoped to the subject container, or the whole pod when
                         there is no subject container; absent when the cluster is unconfigured
                         or the incident has no pod.
                    example: https://logs.example.grafana.net/explore?schemaVersion=1&panes=...
                relatedIncidents:
                    type: array
                    items:
                        $ref: '#/components/schemas/IncidentRow'
            description: IncidentDetail is everything the incident page shows.
        Pod:
            type: object
            properties:
