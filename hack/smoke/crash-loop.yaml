# Three replicas of one crash loop: the smoke tables print three crash
# incidents for this Deployment, one per pod, and the application's list
# folds them into one rollup row.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-crash
  labels:
    idios-smoke: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smoke-crash
  template:
    metadata:
      labels:
        app: smoke-crash
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "echo hello from attempt; echo line two; exit 1"]
