apiVersion: batch/v1
kind: CronJob
metadata:
  name: smoke-cron-ok
  labels:
    idios-smoke: "true"
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            idios-smoke: "true"
        spec:
          restartPolicy: Never
          containers:
          - name: app
            image: busybox:1.36
            command: ["sh", "-c", "echo run starting; echo the work is done; exit 0"]
