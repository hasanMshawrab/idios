apiVersion: v1
kind: Pod
metadata:
  name: smoke-oom
  labels:
    idios-smoke: "true"
spec:
  restartPolicy: Always
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 5; a=x; while :; do a=\"$a$a\"; done"]
    resources:
      limits:
        memory: 10Mi
      requests:
        memory: 10Mi
