apiVersion: v1
kind: Pod
metadata:
  name: smoke-bare
  labels:
    idios-smoke: "true"
spec:
  restartPolicy: Always
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    resources:
      limits:
        cpu: 50m
        memory: 16Mi
      requests:
        cpu: 10m
        memory: 16Mi
