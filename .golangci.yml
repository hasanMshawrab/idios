version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      # Writes to stdout and stderr have no useful handling when they
      # fail; the process is printing its last words either way.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam
